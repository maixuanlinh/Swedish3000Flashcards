name: SwedishCards
options:
  bundleIdPrefix: com.linapps
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Personal: debug
  Release: release
fileGroups:
  - StoreKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    DEVELOPMENT_TEAM: 2FN25VD7TR
    # Phone development plus the approved temporary iPad simulator validation.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_PREVIEWS: NO
    Personal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SWEDISHCARDS_PERSONAL"
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_PREVIEWS: NO
targets:
  SwedishCards:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - BundledArtwork
      - path: Resources/BundledArtwork
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linapps.swedish3000
        INFOPLIST_KEY_CFBundleDisplayName: 3000 Swedish Words
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Personal:
          # Preserve the identity and data of the installed personal copy.
          PRODUCT_BUNDLE_IDENTIFIER: com.linapps.swedish3000.personal
          INFOPLIST_KEY_CFBundleDisplayName: Swedish Words Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: PersonalIcon
          MARKETING_VERSION: "0.1"
          CURRENT_PROJECT_VERSION: 1
  SwedishCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: StoreKit/SwedishCards.storekit
        buildPhase: resources
    dependencies:
      - target: SwedishCards
  SwedishCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: StoreKit/SwedishCards.storekit
        buildPhase: resources
    dependencies:
      - target: SwedishCards
schemes:
  3000 Swedish Words:
    build:
      targets:
        SwedishCards: all
    test:
      targets:
        - SwedishCardsTests
        - SwedishCardsUITests
  3000 Swedish Words Local Purchases:
    build:
      targets:
        SwedishCards: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/SwedishCards.storekit
      environmentVariables:
        SWEDISHCARDS_STOREKIT_TESTING: "1"
    test:
      targets:
        - SwedishCardsTests
        - SwedishCardsUITests
  3000 Swedish Words Personal:
    build:
      targets:
        SwedishCards: all
    run:
      config: Personal
    test:
      config: Debug
      targets:
        - SwedishCardsTests
        - SwedishCardsUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
